name: Update HKIA Flight Data

on:
  schedule:
    # Runs at 18:00 UTC every Sunday (2:00 AM Monday in Hong Kong Time)
    - cron: '0 18 * * 0' 
  workflow_dispatch: # Allows you to run it manually by clicking a button in GitHub

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the new data back to your repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Fetch Script
        run: python fetch_flights.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flights.json
          git commit -m "Automated update: refresh 7-day flight data" || exit 0
          git push
